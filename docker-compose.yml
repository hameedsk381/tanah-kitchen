version: '3.8'

services:
  # Node.js Application & API Server
  tanah-kitchen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanah-kitchen-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID:-${GCP_PROJECT_ID}}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-${GCP_STORAGE_BUCKET}}
      - GCS_CLIENT_EMAIL=${GCS_CLIENT_EMAIL:-${GCP_CLIENT_EMAIL}}
      - GCS_PRIVATE_KEY=${GCS_PRIVATE_KEY:-${GCP_PRIVATE_KEY}}
      - GCP_PROJECT_ID=${GCS_PROJECT_ID:-${GCP_PROJECT_ID}}
      - GCP_STORAGE_BUCKET=${GCS_BUCKET_NAME:-${GCP_STORAGE_BUCKET}}
      - GCP_CLIENT_EMAIL=${GCS_CLIENT_EMAIL:-${GCP_CLIENT_EMAIL}}
      - GCP_PRIVATE_KEY=${GCS_PRIVATE_KEY:-${GCP_PRIVATE_KEY}}
      - GCP_PUBLIC_URL_PREFIX=${GCP_PUBLIC_URL_PREFIX}
    volumes:
      # Host volume for custom uploaded photos
      - ./uploads:/app/uploads

