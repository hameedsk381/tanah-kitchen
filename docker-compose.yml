version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7
    container_name: tanah-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Node.js Application & API Server
  tanah-kitchen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanah-kitchen-app
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/tanah_kitchen
    volumes:
      # Host volume for custom uploaded photos
      - ./uploads:/app/uploads
      # Host volume for backup JSON files
      - ./server/data:/app/server/data

volumes:
  mongo-data:
    driver: local
