version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7
    container_name: tanah-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Node.js Application & API Server
  tanah-kitchen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanah-kitchen-app
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/tanah_kitchen
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_STORAGE_BUCKET=${GCP_STORAGE_BUCKET}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY}
      - GCP_PUBLIC_URL_PREFIX=${GCP_PUBLIC_URL_PREFIX}
    volumes:
      # Host volume for custom uploaded photos
      - ./uploads:/app/uploads

volumes:
  mongo-data:
    driver: local
